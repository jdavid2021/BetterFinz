services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betterfinz}
      POSTGRES_USER: ${POSTGRES_USER:-betterfinz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1},backend
    ports: ["8000:8000"]
    volumes: [./imports:/app/imports:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  sync-worker:
    build: ./backend
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$${HOSTNAME} --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
  sync-scheduler:
    build: ./backend
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://backend:8000
      SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-FinLeash}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-privacy@example.com}
      LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:-the laws of the operator's registered jurisdiction}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-2026-08-23}
      LEGAL_RETENTION_DAYS: ${LEGAL_RETENTION_DAYS:-30}
      DELETION_GRACE_DAYS: ${DELETION_GRACE_DAYS:-30}
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
